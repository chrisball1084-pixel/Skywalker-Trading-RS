<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Skywalker RS">
<title>Skywalker RS</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230a0e14'/%3E%3Cg fill='%233ad6ff'%3E%3Crect x='30' y='110' width='12' height='40'/%3E%3Crect x='48' y='90' width='12' height='60'/%3E%3Crect x='66' y='70' width='12' height='80'/%3E%3Crect x='84' y='50' width='12' height='100'/%3E%3Crect x='102' y='64' width='12' height='86'/%3E%3Crect x='120' y='40' width='12' height='110'/%3E%3Crect x='138' y='58' width='12' height='92'/%3E%3C/g%3E%3C/svg%3E">
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22Skywalker%20RS%22%2C%22short_name%22%3A%22Skywalker%20RS%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230a0e14%22%2C%22theme_color%22%3A%22%230a0e14%22%2C%22start_url%22%3A%22.%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%253D%2527http%253A%252F%252Fwww.w3.org%252F2000%252Fsvg%2527%2520viewBox%253D%25270%25200%2520180%2520180%2527%253E%253Crect%2520width%253D%2527180%2527%2520height%253D%2527180%2527%2520fill%253D%2527%25230a0e14%2527%252F%253E%253Cg%2520fill%253D%2527%25233ad6ff%2527%253E%253Crect%2520x%253D%252784%2527%2520y%253D%252750%2527%2520width%253D%252712%2527%2520height%253D%2527100%2527%252F%253E%253C%252Fg%253E%253C%252Fsvg%253E%22%2C%22sizes%22%3A%22180x180%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">
<style>
  :root{
    --bg:#0a0e14; --panel:#111722; --panel2:#0d1420; --line:#1c2534;
    --ink:#e6edf3; --dim:#7d8aa0; --faint:#4a5568;
    --up:#3ad6ff; --up-soft:#0b2b3d; --down:#f87171; --down-soft:#3a1f22;
    --accent:#38bdf8; --gold:#fbbf24;
    --mono:'SF Mono',ui-monospace,'JetBrains Mono','Menlo',monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
  body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);-webkit-text-size-adjust:100%}

  header{
    position:sticky;top:0;z-index:20;background:rgba(10,14,20,.92);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
    padding:10px 12px calc(10px + env(safe-area-inset-top)) 12px;padding-top:calc(10px + env(safe-area-inset-top));
  }
  .brand{display:flex;align-items:center;gap:9px}
  .logo{width:22px;height:22px;flex:none}
  .title{font-weight:700;font-size:16px;letter-spacing:.02em}
  .title small{font-weight:500;color:var(--dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-left:6px}
  .bench{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim)}
  .bench b{color:var(--accent)}
  .toolbar{display:flex;gap:6px;margin-top:9px}
  button.tb{
    flex:1;background:var(--panel);border:1px solid var(--line);color:var(--ink);
    font-family:var(--sans);font-size:12px;font-weight:600;padding:8px 4px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;transition:.12s;
  }
  button.tb:active{transform:scale(.97);background:var(--line)}
  button.tb.primary{background:var(--up-soft);border-color:#1d5a78;color:var(--up)}
  button.tb svg{width:14px;height:14px}

  .sortbar{display:flex;align-items:center;gap:6px;margin-top:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .sortbar::-webkit-scrollbar{display:none}
  .sortlbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);flex:none;font-weight:600}
  .chip{flex:none;background:var(--panel2);border:1px solid var(--line);color:var(--dim);
    font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:14px;cursor:pointer;transition:.12s;font-family:var(--sans)}
  .chip:active{transform:scale(.96)}
  .chip.active{background:var(--up-soft);border-color:#23617f;color:var(--up)}

  .nm-pop{position:fixed;left:12px;right:12px;z-index:50;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.15s;transform:translateY(-4px)}
  .nm-pop.show{opacity:1;pointer-events:auto;transform:translateY(0)}
  .nm-pop .t{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--ink)}
  .nm-pop .s{font-size:12px;color:var(--dim);margin-top:3px}
  .nm-pop .stats{display:flex;gap:14px;margin-top:9px;font-family:var(--mono);font-size:11px}
  .nm-pop .stats b{display:block;color:var(--faint);font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}

  .status{font-family:var(--mono);font-size:10.5px;color:var(--dim);padding:6px 12px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;gap:8px}
  .status .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
  .status .dot.live{background:var(--up);box-shadow:0 0 8px var(--up)}
  .status .dot.err{background:var(--down)}
  .status .dot.warn{background:var(--gold);box-shadow:0 0 8px var(--gold)}
  .status.hidden{display:none}
  .status #statusText{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .status #statusMeta{display:flex;align-items:center;gap:7px;flex:none}
  button.ministat{background:var(--up-soft);border:1px solid #1d5a78;color:var(--up);
    font-family:var(--sans);font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:11px;cursor:pointer}
  button.ministat:active{transform:scale(.96)}

  main{padding:0 0 40px}
  .group-head{
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--dim);padding:14px 12px 5px;position:sticky;top:0;
    background:linear-gradient(180deg,var(--bg),rgba(10,14,20,.6));z-index:5;
  }
  .row{
    display:grid;grid-template-columns:84px minmax(0,1fr) 46px 46px 28px;align-items:center;gap:6px;
    padding:8px 10px;border-bottom:1px solid var(--line);position:relative;
  }
  .colhead{
    display:grid;grid-template-columns:84px minmax(0,1fr) 46px 46px 28px;gap:6px;padding:0 10px 5px;
    font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
  }
  .colhead span:nth-child(3),.colhead span:nth-child(4){text-align:center}
  .row.bench-row{background:var(--panel2)}
  .tk{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.01em;min-width:0}
  .tk .nm{display:block;font-family:var(--sans);font-weight:400;font-size:11px;color:var(--dim);letter-spacing:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .tk .meta{display:flex;gap:5px;margin-top:3px;align-items:baseline;font-family:var(--mono);font-size:10px;font-weight:700}
  .tk .meta .lab{color:var(--faint);font-weight:600;font-size:9px}
  .spark{height:34px;width:100%;display:block}
  .spark.empty{opacity:.25}
  .sts{font-family:var(--mono);font-size:13px;font-weight:700;text-align:center;padding:5px 2px;border-radius:7px}
  .thr{font-family:var(--mono);font-size:13px;font-weight:700;text-align:center;padding:5px 2px;border-radius:7px}
  .chg{font-family:var(--mono);font-size:11px;text-align:right;color:var(--dim);display:block}
  .chg.pos{color:var(--up)} .chg.neg{color:var(--down)}
  .tvbtn{width:100%;height:26px;display:flex;align-items:center;justify-content:center;
    background:transparent;border:none;cursor:pointer;color:var(--faint);margin-top:3px}
  .tvbtn:active{color:var(--accent)}
  .tvbtn svg{width:14px;height:14px}
  .tvbtn-ph{display:block;height:26px}
  .rank-badge{position:absolute;left:0;top:0;bottom:0;width:3px}
  .col4{display:flex;flex-direction:column;align-items:flex-end;justify-content:center}

  /* Übersicht / Dashboard */
  .dash-grp{padding:12px 12px 4px}
  .dash-grp h4{margin:0 0 8px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--dim);font-weight:600}
  .strip{display:flex;gap:2px;height:30px;border-radius:6px;overflow:hidden;margin-bottom:9px}
  .strip a{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:8.5px;font-weight:700;text-decoration:none;overflow:hidden}
  .dash-cols{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .dash-card{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 9px}
  .dash-card h5{margin:0 0 6px;font-size:9px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--faint);font-weight:700}
  .dash-card .ln{display:flex;align-items:baseline;gap:6px;font-family:var(--mono);font-size:11.5px;
    padding:2.5px 0;text-decoration:none}
  .dash-card .ln b{font-weight:700;color:var(--ink);flex:none;width:44px}
  .dash-card .ln i{font-style:normal;color:var(--dim);font-size:9.5px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .dash-card .ln u{text-decoration:none;font-weight:700;flex:none}
  .dash-legend{padding:2px 12px 22px;font-family:var(--mono);font-size:9.5px;color:var(--faint);line-height:1.6}

  .empty-state{text-align:center;padding:60px 30px;color:var(--dim)}
  .empty-state h2{color:var(--ink);font-size:17px;margin:0 0 8px}
  .empty-state p{font-size:13px;line-height:1.6;margin:0 0 20px}
  .empty-state .k{font-family:var(--mono);color:var(--accent)}

  /* Sheet / modal */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;pointer-events:none;transition:.2s}
  .sheet-bg.open{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--panel);
    border-top:1px solid var(--line);border-radius:16px 16px 0 0;
    transform:translateY(100%);transition:transform .24s cubic-bezier(.32,.72,0,1);
    max-height:88vh;display:flex;flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .sheet.open{transform:translateY(0)}
  .sheet-grip{width:36px;height:4px;border-radius:2px;background:var(--faint);margin:9px auto 4px}
  .sheet-head{display:flex;align-items:center;padding:6px 16px 12px;border-bottom:1px solid var(--line)}
  .sheet-head h3{margin:0;font-size:15px;font-weight:700}
  .sheet-head .x{margin-left:auto;background:none;border:none;color:var(--dim);font-size:22px;cursor:pointer;padding:0 4px;line-height:1}
  .sheet-body{overflow-y:auto;padding:14px 16px;-webkit-overflow-scrolling:touch}

  label.field{display:block;margin-bottom:16px}
  label.field .lab{font-size:12px;font-weight:600;color:var(--dim);margin-bottom:6px;display:block}
  label.field .hint{font-size:11px;color:var(--faint);font-weight:400;margin-top:5px;line-height:1.5}
  input.inp,textarea.inp,select.inp{
    width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    font-family:var(--mono);font-size:13px;padding:11px 12px;border-radius:9px;
  }
  input.inp:focus,textarea.inp:focus{outline:none;border-color:var(--accent)}
  textarea.inp{min-height:220px;resize:vertical;line-height:1.7;white-space:pre;overflow-x:auto}
  .btn-primary{
    width:100%;background:var(--up);border:none;color:#062012;font-weight:700;font-size:14px;
    padding:13px;border-radius:10px;cursor:pointer;margin-top:4px;
  }
  .btn-primary:active{opacity:.85}
  .btn-ghost{
    width:100%;background:transparent;border:1px solid var(--line);color:var(--dim);font-weight:600;font-size:13px;
    padding:11px;border-radius:10px;cursor:pointer;margin-top:9px;
  }
  .keylink{color:var(--accent);text-decoration:none}
  .seg-legend{font-size:11px;color:var(--faint);line-height:1.7;font-family:var(--mono)}
  .seg-legend b{color:var(--dim)}
  .toast{
    position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
    background:var(--line);color:var(--ink);font-size:12.5px;padding:10px 16px;border-radius:20px;z-index:60;
    opacity:0;transition:.25s;pointer-events:none;max-width:88vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.err{background:var(--down-soft);color:#fca5a5;border:1px solid #5b2a2e}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg class="logo" viewBox="0 0 180 180"><g fill="var(--up)">
      <rect x="30" y="110" width="12" height="40"/><rect x="48" y="90" width="12" height="60"/>
      <rect x="66" y="70" width="12" height="80"/><rect x="84" y="50" width="12" height="100"/>
      <rect x="102" y="64" width="12" height="86"/><rect x="120" y="40" width="12" height="110"/>
      <rect x="138" y="58" width="12" height="92"/></g></svg>
    <span class="title">Skywalker RS<small id="verLbl">v2026.08.11-1</small></span>
    <span class="bench">vs <b id="benchLabel">SPX</b></span>
  </div>
  <div class="toolbar">
    <button class="tb primary" id="btnRefresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      Aktualisieren
    </button>
    <button class="tb" id="btnTickers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1.5" fill="currentColor" stroke="none"/><circle cx="3.5" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="3.5" cy="18" r="1.5" fill="currentColor" stroke="none"/></svg>
      Ticker
    </button>
    <button class="tb" id="btnSettings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Setup
    </button>
  </div>
  <div class="sortbar" id="viewbar"></div>
  <div class="sortbar" id="sortbar">
    <span class="sortlbl">Sortieren</span>
    <button class="chip active" data-sort="orig">Original</button>
    <button class="chip" data-sort="pct">RS %</button>
    <button class="chip" data-sort="thrust">Thrust</button>
    <button class="chip" data-sort="dayrs">Tag RS</button>
    <button class="chip" data-sort="chg">Tag %</button>
  </div>
</header>

<div class="status hidden" id="status">
  <span style="display:flex;align-items:center;gap:7px"><span class="dot" id="statusDot"></span><span id="statusText">Bereit</span></span>
  <span id="statusMeta"></span>
</div>

<main id="main"></main>

<!-- Ticker sheet -->
<div class="sheet-bg" id="tickerBg"></div>
<div class="sheet" id="tickerSheet">
  <div class="sheet-grip"></div>
  <div class="sheet-head"><h3>Ticker-Liste</h3><button class="x" data-close>&times;</button></div>
  <div class="sheet-body">
    <label class="field">
      <span class="lab">Symbole & Gruppen</span>
      <textarea class="inp" id="tickerText" spellcheck="false" autocapitalize="off"></textarea>
      <span class="hint">
        Ein Ticker pro Zeile. Optionales Format: <span style="color:var(--accent)">TICKER, Anzeigename</span>.<br>
        Gruppen-Überschrift mit vorangestelltem <span style="color:var(--gold)">#</span>, z.&nbsp;B. <span style="color:var(--gold)">#SPDR Sektoren</span>.<br>
        Der Benchmark wird separat im Setup gesetzt und muss hier nicht stehen.
      </span>
    </label>
    <button class="btn-primary" id="saveTickers">Speichern & Laden</button>
    <button class="btn-ghost" id="resetTickers">Auf Jeffs Standardliste zurücksetzen</button>
  </div>
</div>

<!-- Settings sheet -->
<div class="sheet-bg" id="setBg"></div>
<div class="sheet" id="setSheet">
  <div class="sheet-grip"></div>
  <div class="sheet-head"><h3>Setup</h3><button class="x" data-close>&times;</button></div>
  <div class="sheet-body">
    <label class="field">
      <span class="lab">Twelve Data API-Key</span>
      <input class="inp" id="apiKey" placeholder="dein API-Key" autocapitalize="off" spellcheck="false">
      <span class="hint">Kostenlos unter <a class="keylink" href="https://twelvedata.com/pricing" target="_blank" rel="noopener">twelvedata.com</a> (Free: 800 Abrufe/Tag, 8/Min). Wird nur lokal auf diesem Gerät gespeichert.</span>
    </label>
    <label class="field">
      <span class="lab">Benchmark (Referenz für RS)</span>
      <select class="inp" id="benchSel">
        <option value="RSP">RSP — S&P 500 Equal Weight (Jeffs aktueller Benchmark)</option>
        <option value="SPY">SPY — SPDR S&P 500 ETF (Jeffs Original 2024)</option>
        <option value="SPX">SPX — S&P 500 Index (nur mit Index-Zugang)</option>
      </select>
      <span class="hint">Jeff nutzt seit dem Umbau <b>RSP</b> (Equal Weight) — dadurch misst RS die Breite statt der Mega-Cap-Gewichtung. Index-Daten (SPX) sind oft kostenpflichtig; liefert der Benchmark keine Daten, schaltet die App automatisch auf SPY um.</span>
    </label>
    <label class="field">
      <span class="lab">Zeitfenster (Handelstage)</span>
      <input class="inp" id="windowN" type="number" min="10" max="60" value="21">
      <span class="hint">Jeffs aktuelles Sheet nutzt <b>21</b> (die 1-Mth-RS-Werte rastern exakt in 5 %-Schritten = 1/20). Das Tutorial von 2024 nutzte 25. Anzahl Tage im Histogramm und Basis für RS_STS %.</span>
    </label>
    <label class="field">
      <span class="lab">Datenstand</span>
      <select class="inp" id="lagSel">
        <option value="1">Wie Jeffs Sheet — ein Handelstag Versatz</option>
        <option value="0">Aktuellster Handelstag</option>
      </select>
      <span class="hint">Jeffs Excel zieht die Historie über <span style="color:var(--accent)">STOCKHISTORY</span>, das beim letzten <i>abgeschlossenen</i> Tag endet — seine RS-Spalte hinkt deshalb einen Tag hinterher. Mit Versatz treffen wir sein Sheet exakt (58 von 58 Tickern geprüft). Ohne Versatz sind die Zahlen aktueller, weichen aber von seinen ab.</span>
    </label>
    <label class="field">
      <span class="lab">RS %-Spalte (Berechnung)</span>
      <select class="inp" id="pctSel">
        <option value="time">Zeit-Perzentil (PERCENTRANK)</option>
        <option value="stoch">Stochastik (Position zwischen Tief und Hoch)</option>
        <option value="peer">Peer-Rang innerhalb der Gruppe</option>
      </select>
      <span class="hint">Alle drei messen, wo die heutige RS innerhalb der letzten <span id="pctWinLbl">21</span> Tage steht — nur unterschiedlich.<br>
      <b>Zeit-Perzentil</b>: wie viele der Tage darunter liegen (Jeffs Formel von 2024).<br>
      <b>Stochastik</b>: Position zwischen Fenster-Tief und -Hoch. Trifft sein aktuelles Sheet in meinen Tests etwas besser.<br>
      <b>Peer-Rang</b>: Rang gegen die anderen Ticker derselben Gruppe.<br>
      Wechseln kostet kein Neuladen — die Werte werden sofort neu berechnet.</span>
    </label>

/* ---------- State ---------- */

// einen Handelstag hinterher. Mit diesem Versatz treffen wir sein Sheet exakt (58/58 geprueft).

const HISTORY = 100;   // Handelstage, die pro Ticker gespeichert werden (Fenster wird lokal daraus geschnitten)
let chartSrc = localStorage.getItem('rs.chartsrc') || 'tv';   // Ziel des Chart-Icons
let viewMode = localStorage.getItem('rs.view') || 'list';     // 'list' | 'dash'

let sortMode = localStorage.getItem('rs.sort') || 'orig';

/* ---------- Parsing ---------- */
function parseTickers(text){
  const out = [];
  text.split(/\r?\n/).forEach(raw=>{
    const line = raw.trim();
    if(!line) return;
    if(line.startsWith('#')){ out.push({type:'group', label:line.slice(1).trim()}); return; }
    const [tk, ...rest] = line.split(',');
    const ticker = tk.trim().toUpperCase();
    if(!ticker) return;
    out.push({type:'tk', ticker, name:(rest.join(',').trim()||ticker)});
  });
  return out;
}
function loadTickers(){
  const raw = localStorage.getItem(LS.tickers) || DEFAULT_TICKERS;
  ROWS = parseTickers(raw);
}

/* ---------- Sparkline (histogram) ---------- */
function histogramSVG(series, opts={}){
  // series = array of normalized RS values (relative to first). We plot deviation from 1.
  const w = 100, h = 34, n = series.length;
  if(!n) return `<svg class="spark empty" viewBox="0 0 ${w} ${h}"></svg>`;
  const devs = series.map(v => v - 1);                 // center at 0
  const maxAbs = Math.max(0.0001, ...devs.map(d=>Math.abs(d)));
  const bw = w / n, gap = Math.min(1.2, bw*0.18), mid = h/2;
  let bars = '';
  const last = n-1;
  // Jeffs Legende: "The dark green bar indicates the RS high point."
  let hiIdx = 0;
  for(let i=1;i<n;i++) if(series[i] > series[hiIdx]) hiIdx = i;
  devs.forEach((d,i)=>{
    const bh = Math.max(0.8, (Math.abs(d)/maxAbs) * (h/2 - 1));
    const x = i*bw + gap/2;
    const bwi = bw - gap;
    const up = d >= 0;
    const y = up ? mid - bh : mid;
    // fade older bars a touch; highlight most recent + RS-Hochpunkt
    const isLast = i===last;
    const col = i===hiIdx ? 'var(--gold)' : (up ? 'var(--up)' : 'var(--down)');
    const op = (isLast || i===hiIdx) ? 1 : (0.42 + 0.5*(i/last||0));
    bars += `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${bwi.toFixed(2)}" height="${bh.toFixed(2)}" rx="0.4" fill="${col}" opacity="${op.toFixed(2)}"/>`;
  });
  const zero = `<line x1="0" y1="${mid}" x2="${w}" y2="${mid}" stroke="var(--line)" stroke-width="0.6"/>`;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${zero}${bars}</svg>`;
}

/* ---------- Percentile (Excel PERCENTRANK.INC equivalent) ---------- */
function percentRank(arr, x){
  const a = [...arr].sort((p,q)=>p-q), N=a.length;
  if(N<2) return null;
  if(x<=a[0]) return 0; if(x>=a[N-1]) return 1;
  let i=0; while(i<N-1 && a[i+1]<=x) i++;
  if(a[i]===x) return i/(N-1);
  const lo=a[i], hi=a[i+1];
  return (i + (x-lo)/(hi-lo))/(N-1);
}
function weightedThrust(rs){
  // 1-week weighted RS: gewichtete Summe der täglichen RS-Wachstumsraten über die letzten 5 Tage.
  // Gewichte 5,4,3,2,1 (jüngster Tag am stärksten). Ergebnis als % um 100 herum.
  const n = rs.length;
  if(n < 2) return null;
  const days = Math.min(5, n-1);
  const weights = [];
  for(let k=days;k>=1;k--) weights.push(k);       // z.B. [5,4,3,2,1]
  const wsum = weights.reduce((a,b)=>a+b,0);
  let acc = 0;
  for(let j=0;j<days;j++){
    const idx = n-1-j;                              // jüngster zuerst
    const chg = rs[idx]/rs[idx-1] - 1;
    acc += chg * weights[j];
  }
  const wAvg = acc / wsum;                          // gewichtete mittlere Tagesänderung
  return 1 + wAvg * 5;                              // auf Woche hochrechnen, um 100% zentriert
}
// Thrust liegt eng um 100 % herum, deshalb eine feinere Skala als bei der RS-Spalte.
function thrColor(t){
  if(t==null) return {bg:'transparent',fg:'var(--faint)'};
  const d = (t-1)*100;                     // Abweichung von 100 % in Prozentpunkten
  if(d>=3)  return {bg:'#0b4a6b',fg:'#bae6fd'};
  if(d>=1)  return {bg:'#0d5f85',fg:'#e0f2fe'};
  if(d>=0)  return {bg:'#12313f',fg:'#a5dfff'};
  if(d>=-2) return {bg:'#3a1f22',fg:'#fca5a5'};
  return {bg:'#7f1d1d',fg:'#fecaca'};
}
function stsColor(p){
  if(p==null) return {bg:'transparent',fg:'var(--faint)'};
  // green ramp like the sheet's conditional formatting
  if(p>=0.85) return {bg:'#0b4a6b',fg:'#bae6fd'};
  if(p>=0.65) return {bg:'#0d5f85',fg:'#e0f2fe'};
  if(p>=0.45) return {bg:'#12313f',fg:'#a5dfff'};
  if(p>=0.25) return {bg:'#1c2432',fg:'#94a3b8'};
  return {bg:'transparent',fg:'var(--faint)'};
}

/* ---------- Rendering ---------- */
// Gruppen-Blöcke aus ROWS bilden — von Liste und Übersicht gemeinsam genutzt.
function buildBlocks(){
  const blocks = [];
  let cur = {label:null, items:[]};
  ROWS.forEach(r=>{
    if(r.type==='group'){ if(cur.items.length||cur.label!==null) blocks.push(cur); cur={label:r.label, items:[]}; }
    else cur.items.push(r);
  });
  if(cur.items.length||cur.label!==null) blocks.push(cur);
  return blocks;
}
// Nur die im Reiter gewaehlte Gruppe. Unbekannter Filter (z. B. Gruppe umbenannt) -> alles.
function visibleBlocks(){
  const all = buildBlocks();
  if(!groupFilter) return all;
  const sel = all.filter(b=>b.label===groupFilter);
  return sel.length ? sel : all;
}

/* ---------- Übersicht ---------- */
// Pro Gruppe ein Farbstreifen (Monatsstärke auf einen Blick) und darunter die beiden
// Extreme: stärkste/schwächste nach RS % (Monat) und nach Thrust (Woche).
function renderDash(dataMap){
  const has = t => { const d=dataMap&&dataMap[t]; return d&&d.rs&&d.rs.length ? d : null; };
  let html = '';
  visibleBlocks().forEach(bl=>{
    const items = bl.items.filter(r=>has(r.ticker));
    if(!items.length) return;
    html += `<div class="dash-grp"><h4>${esc(bl.label||'Ohne Gruppe')} <span style="color:var(--faint)">· ${items.length}</span></h4>`;

    // Farbstreifen, nach Monatsstärke sortiert
    const byPct = [...items].sort((a,b)=> (has(b.ticker).pct??-1)-(has(a.ticker).pct??-1));
    html += '<div class="strip">' + byPct.map(r=>{
      const d = has(r.ticker), c = stsColor(d.pct);
      const bg = c.bg==='transparent' ? '#151b26' : c.bg;
      return `<a href="${chartURL(r.ticker)}" target="_blank" rel="noopener" style="background:${bg};color:${c.fg}" title="${esc(r.ticker)}">${esc(r.ticker)}</a>`;
    }).join('') + '</div>';

    const line = (r, val, col) => {
      const d = has(r.ticker);
      return `<a class="ln" href="${chartURL(r.ticker)}" target="_blank" rel="noopener"><b>${esc(r.ticker)}</b><i>${esc(r.name||'')}</i><u style="color:${col(d)}">${val(d)}</u></a>`;
    };
    const sign = v => (v>=0?'+':'') + v.toFixed(1) + '%';
    const posCol = v => v==null?'var(--faint)':(v>=0?'var(--up)':'var(--down)');

    // Die drei Zeitebenen: Tag = RS-Rotation von gestern, Woche = Thrust, Monat = RS %
    const ebenen = [
      {t:'Tag',  key:'dayRS',  txt:d=>d.dayRS==null?'—':sign(d.dayRS),           col:d=>posCol(d.dayRS)},
      {t:'Woche',key:'thrust', txt:d=>d.thrust==null?'—':Math.round(d.thrust*100)+'%', col:d=>d.thrust==null?'var(--faint)':(d.thrust>=1?'var(--up)':'var(--down)')},
      {t:'Monat',key:'pct',    txt:d=>d.pct==null?'—':Math.round(d.pct*100)+'%', col:d=>d.pct==null?'var(--faint)':(d.pct>=.65?'var(--up)':(d.pct<.3?'var(--down)':'var(--dim)'))}
    ];
    const n = Math.min(3, Math.floor(items.length/2)) || 1;
    html += '<div class="dash-cols">' + ebenen.map(e=>{
      const sorted = [...items].sort((a,b)=> (has(b.ticker)[e.key]??-Infinity)-(has(a.ticker)[e.key]??-Infinity));
      return `<div class="dash-card"><h5>${e.t} · stark</h5>${sorted.slice(0,n).map(r=>line(r,e.txt,e.col)).join('')}</div>
              <div class="dash-card"><h5>${e.t} · schwach</h5>${sorted.slice(-n).reverse().map(r=>line(r,e.txt,e.col)).join('')}</div>`;
    }).join('') + '</div></div>';
  });
  const stand = fmtDay((loadMeta()||{}).dataDate);
  html += `<div class="dash-legend">Streifen: nach Monats-RS, stärkster links.<br>
    <b>Tag</b> = RS-Veränderung am letzten Tag — misst Rotation, nicht Tagesperformance.<br>
    <b>Woche</b> = Thrust · <b>Monat</b> = RS-Perzentil über ${windowN} Handelstage.<br>
    Kursstand ${stand}${lagDays>0?` − ${lagDays} Tag (wie Jeffs Sheet)`:''}. Tippen öffnet den Chart.</div>`;
  $('#main').innerHTML = html || emptyState('tickers');
}

function render(dataMap){
  const main = $('#main');
  if(!localStorage.getItem(LS.key)){
    main.innerHTML = emptyState('setup'); return;
  }
  if(!ROWS.length){ main.innerHTML = emptyState('tickers'); return; }
  renderStatus(dataMap);
  $('#sortbar').style.display = viewMode==='dash' ? 'none' : '';
  if(viewMode==='dash'){ renderDash(dataMap); return; }

  let html = '';
  // benchmark pinned first
  const b = dataMap && dataMap[activeBench];
  html += `<div class="group-head">Benchmark</div>`;
  html += rowHTML({type:'tk', ticker:activeBench, name:'Referenz'}, null, true, b);

  const blocks = visibleBlocks();

  const val = (r)=>{
    const d = dataMap && dataMap[r.ticker];
    if(!d) return -Infinity;
    if(sortMode==='pct') return d.pct==null?-Infinity:d.pct;
    if(sortMode==='thrust') return d.thrust==null?-Infinity:d.thrust;
    if(sortMode==='dayrs') return d.dayRS==null?-Infinity:d.dayRS;
    if(sortMode==='chg') return d.dayChg==null?-Infinity:d.dayChg;
    return 0;
  };
  const colHead = `<div class="colhead"><span></span><span></span><span>Thrust</span><span>RS ${windowN}T</span><span></span></div>`;
  blocks.forEach(bl=>{
    if(bl.label) html += `<div class="group-head">${esc(bl.label)}</div>` + colHead;
    let items = bl.items;
    if(sortMode!=='orig'){ items = [...items].sort((a,c)=> val(c)-val(a)); }
    items.forEach(r=>{
      const d = dataMap && dataMap[r.ticker];
      html += rowHTML(r, d, false, null);
    });
  });
  main.innerHTML = html;
}
function rowHTML(r, d, isBench, benchData){
  let spark='', sts='', thrCell='', chg='', chgCls='', barCol='transparent', metaLine='';
  const emptySpark = `<svg class="spark empty" viewBox="0 0 100 32"><line x1="0" y1="16" x2="100" y2="16" stroke="var(--line)" stroke-width="0.6"/></svg>`;
  if(isBench){
    spark = emptySpark;
    sts = `<span class="sts" style="color:var(--faint)">—</span>`;
    thrCell = `<span class="thr" style="color:var(--faint)">—</span>`;
    if(benchData && benchData.lastClose!=null){ chg = fmtChg(benchData.dayChg); chgCls = benchData.dayChg>=0?'pos':'neg'; }
    metaLine = `<span class="meta"><span class="lab">Referenz</span></span>`;
  } else if(d && d.rs && d.rs.length){
    spark = histogramSVG(d.rs);
    const p = d.pct;
    const c = stsColor(p);
    sts = `<span class="sts" style="background:${c.bg};color:${c.fg}">${p==null?'—':Math.round(p*100)+'%'}</span>`;
    if(p!=null){ barCol = p>=0.65?'var(--up)':(p<0.3?'var(--down)':'var(--faint)'); }
    if(d.dayChg!=null){ chg = fmtChg(d.dayChg); chgCls = d.dayChg>=0?'pos':'neg'; }
    const t = thrColor(d.thrust);
    thrCell = `<span class="thr" style="background:${t.bg};color:${t.fg}">${d.thrust==null?'—':Math.round(d.thrust*100)+'%'}</span>`;
    metaLine = '';
  } else {
    spark = emptySpark;
    sts = `<span class="sts" style="color:var(--faint)">·</span>`;
    thrCell = `<span class="thr" style="color:var(--faint)">·</span>`;
    metaLine = `<span class="meta"><span class="lab" style="color:var(--faint)">—</span></span>`;
  }
  // Echtes <a> statt Button: nur eine direkte Nutzer-Antippen-Navigation loest unter iOS
  // Universal Links aus. Ein per JavaScript geoeffneter Link landet immer im eingebetteten
  // Safari, und der reicht nicht an die installierte App weiter.
  const tvIcon = isBench ? '<span class="tvbtn-ph"></span>' : `<a class="tvbtn" href="${chartURL(r.ticker)}" target="_blank" rel="noopener" aria-label="Chart ${esc(r.ticker)}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="4 14 9 9 13 13 20 6"/><polyline points="15 6 20 6 20 11"/></svg></a>`;
  const nm = `<span class="nm">${esc(r.name||'')}</span>`;
  return `<div class="row${isBench?' bench-row':''}">
    <span class="rank-badge" style="background:${barCol}"></span>
    <span class="tk">${esc(r.ticker)}${nm}<span class="chg ${chgCls}" style="text-align:left">${chg}</span>${metaLine}</span>
    ${spark}
    ${thrCell}
    ${sts}
    <span class="col4">${tvIcon}</span>
  </div>`;
}
function fmtChg(v){ if(v==null||isNaN(v)) return ''; const s=v>=0?'+':''; return s+v.toFixed(1)+'%'; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// TradingView-Chart öffnen.
// window.open('https://…') landet aus einer installierten PWA heraus immer im Safari-Sheet,
// weil Universal Links dort nicht greifen. Darum zuerst das App-Schema versuchen und erst
// nach kurzer Wartezeit auf die Website zurückfallen, falls die App nicht reagiert hat.
// Ohne Boersenkuerzel oeffnet die TradingView-App zwar, wechselt aber das Symbol nicht.
// Die meisten ETFs hier laufen an der NYSE Arca (in TradingView "AMEX"), der Rest an der Nasdaq.
const NASDAQ = new Set(['QQQ','QQQE','AAPL','MSFT','AMZN','GOOGL','NVDA','AMD','TSLA','BABA','COIN',
  'SVIX','WCLD','CLOU','IGV','BOTZ','ROBO','ARKF','ARKX','ARKG','ARKQ','QTUM','FDN','IBUY','KWEB',
  'CHIQ','CIBR','BUG','XSW','ESPO','UFO','GRID','PAVE','SHLD','URNM','NLR','SILJ','LIT','WOOD','IPAY']);
const CHART_SRC = {
  tv:   t => 'https://www.tradingview.com/chart/?symbol=' + encodeURIComponent((NASDAQ.has(t)?'NASDAQ:':'AMEX:') + t),
  tvpl: t => 'https://www.tradingview.com/chart/?symbol=' + encodeURIComponent(t),
  fv:   t => 'https://finviz.com/quote.ashx?t=' + encodeURIComponent(t),
  sc:   t => 'https://stockcharts.com/h-sc/ui?s=' + encodeURIComponent(t)
};
function chartURL(ticker){
  return esc((CHART_SRC[chartSrc] || CHART_SRC.tv)(ticker));
}
// Namen + Kennzahlen als Popover zeigen (Tap auf Ticker)
let nmPopTimer;
function showName(el){
  const pop = $('#nmPop');
  const tk = el.dataset.tk, nm = el.dataset.name;
  pop.innerHTML = `<div class="t">${esc(tk)}</div><div class="s">${esc(nm)}</div>
    <div class="stats">
      <div><b>Thrust</b>${esc(el.dataset.thr)}</div>
      <div><b>1-Month RS</b>${esc(el.dataset['1m'])}</div>
      <div><b>Tag</b>${esc(el.dataset.chg)}</div>
    </div>`;
  const rect = el.getBoundingClientRect();
  pop.style.top = Math.min(window.innerHeight-120, rect.bottom+6) + 'px';
  pop.classList.add('show');
  clearTimeout(nmPopTimer);
  nmPopTimer = setTimeout(()=>pop.classList.remove('show'), 3500);
}
document.addEventListener('click', e=>{
  if(!e.target.closest('.tk') && !e.target.closest('.nm-pop')) $('#nmPop').classList.remove('show');
});

function emptyState(kind){
  if(kind==='setup') return `<div class="empty-state">
    <h2>Erst einrichten</h2>
    <p>Trag deinen <span class="k">Twelve Data API-Key</span> im Setup ein.
    Er ist kostenlos und bleibt nur auf diesem Gerät.</p>
    <button class="btn-primary" style="max-width:240px;margin:0 auto" onclick="openSheet('set')">Zum Setup</button>
  </div>`;
  return `<div class="empty-state"><h2>Keine Ticker</h2><p>Füg unter <span class="k">Ticker</span> Symbole hinzu.</p></div>`;
}

/* ---------- Data fetch ---------- */
const API = 'https://api.twelvedata.com/time_series';
async function fetchSeries(symbol, key, outputsize){
  const url = `${API}?symbol=${encodeURIComponent(symbol)}&interval=1day&outputsize=${outputsize}&order=ASC&apikey=${encodeURIComponent(key)}`;
  const r = await fetch(url);
  const j = await r.json();
  if(j.status==='error') throw new Error(j.message||'API-Fehler ('+symbol+')');
  if(!j.values) return null;
  return j.values.map(v=>({d:v.datetime, c:parseFloat(v.close)})).filter(v=>!isNaN(v.c));
}

async function refresh(opts={}){
  const key = localStorage.getItem(LS.key);
  if(!key){ openSheet('set'); return; }
  // Immer die volle Historie holen, nicht nur das aktuelle Fenster.
  // Twelve Data rechnet Credits pro Anfrage, nicht pro Zeile — mehr Daten kosten also nichts
  // extra, machen aber jede Fensteränderung zu einer reinen Neuberechnung ohne Neuladen.
  const need = HISTORY;
  const forceAll = opts.force===true;

  const syms = [...new Set(ROWS.filter(r=>r.type==='tk').map(r=>r.ticker))];

  // Bestehenden Cache laden und weiterverwenden (inkrementell)
  const cached = loadCache() || {};
  const dataMap = Object.assign({}, cached);
  const todayKey = new Date().toISOString().slice(0,10);
  const loadedToday = getLoadedToday(todayKey);

  showStatus('live','Lade Benchmark …','');

  // 1) Benchmark (immer frisch, mit Fallback -> SPY)
  let benchSym = benchmark, benchSeries=null, benchErr='';
  try{ benchSeries = await fetchSeries(benchSym, key, need); }
  catch(e){ benchErr = e.message||String(e); }
  if((!benchSeries || benchSeries.length<3) && benchmark!=='SPY'){
    toast('Benchmark '+benchmark+' liefert keine Daten – nutze SPY', true);
    benchSym='SPY';
    try{ benchSeries = await fetchSeries('SPY', key, need); }catch(e2){ benchErr = e2.message||benchErr; }
  }
  if(!benchSeries || benchSeries.length<3){
    showStatus('err','Benchmark fehlgeschlagen', benchErr.slice(0,40));
    toast(benchErr ? benchErr.slice(0,80) : 'Benchmark-Daten fehlen. API-Key / Symbol prüfen.', true);
    return;
  }
  // Bei Fallback zeigt die App den tatsächlich verwendeten Benchmark an, nicht den gewünschten.
  activeBench = benchSym;
  $('#benchLabel').textContent = benchSym + (benchSym!==benchmark ? ' *' : '');
  const benchMap = Object.fromEntries(benchSeries.map(v=>[v.d,v.c]));
  const benchLast = benchSeries.at(-1).c, benchPrev = benchSeries.at(-2)?.c;
  dataMap[benchSym] = {lastClose:benchLast, dayChg: benchPrev?((benchLast/benchPrev-1)*100):null};

  // 2) Nur fehlende Ticker laden (die heute noch nicht geladen wurden), außer forceAll
  const todo = syms.filter(sym=>{
    if(sym===benchSym) return false;
    if(forceAll) return true;
    // schon heute geladen UND im Cache vorhanden -> überspringen
    if(loadedToday[sym] && dataMap[sym] && dataMap[sym].rs) return false;
    return true;
  });

  if(todo.length===0){
    applyPct(dataMap);
    render(dataMap); saveCache(dataMap);
    showStatus('live','Alles aktuell (heute geladen)', new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}));
    toast('Alle Ticker heute schon geladen. „Alles neu laden" im Setup erzwingt Neuladen.');
    return;
  }

  let done=0, failed=[], limitHit=false;
  const RATE_MS = 8100;
  const totalTodo = todo.length;
  await acquireWakeLock();   // iOS pausiert Timer, sobald der Bildschirm ausgeht
  for(const sym of todo){
    showStatus('live', `Lade ${sym} …`, `${done}/${totalTodo}${forceAll?'':' (fehlende)'}`);
    try{
      const s = await fetchSeries(sym, key, need);
      if(s && s.length>=3){
        const aligned = s.filter(v=>benchMap[v.d]!=null).slice(-HISTORY);
        if(aligned.length>=3){
          // Rohe RS-Verhaeltnisse speichern. Normierung und Kennzahlen entstehen erst
          // beim Rendern, damit ein anderes Fenster kein Neuladen braucht.
          const rsFull = aligned.map(v=> v.c / benchMap[v.d]);
          const last=s.at(-1).c, prev=s.at(-2)?.c;
          dataMap[sym] = {rsFull, dayChg: prev?((last/prev-1)*100):null, lastClose:last};
          loadedToday[sym] = true;
        }
      }
    }catch(e){
      const msg = (e.message||'').toLowerCase();
      // Twelve Data Limit-Meldungen erkennen
      if(msg.includes('limit') || msg.includes('run out') || msg.includes('credits') || msg.includes('429')){
        limitHit=true; failed.push(sym); break;
      }
      failed.push(sym);
    }
    done++;
    applyPct(dataMap);
    render(dataMap);
    saveCache(dataMap);
    saveLoadedToday(todayKey, loadedToday);
    if(done<totalTodo) await sleep(RATE_MS);
  }
  releaseWakeLock();
  applyPct(dataMap);
  saveCache(dataMap);
  saveMeta({
    lastRun: Date.now(),
    dataDate: benchSeries.at(-1).d,
    bench: benchSym,
    stopped: limitHit ? 'limit' : (failed.length ? 'fehler' : null),
    failed: failed.slice(0,20),
    stoppedAt: limitHit ? failed.at(-1) : null
  });
  render(dataMap);
  if(limitHit){
    toast('Twelve-Data-Limit erreicht. Restliche Ticker morgen laden – bereits geladene bleiben erhalten.', true);
  } else if(failed.length){
    toast('Nicht geladen: '+failed.slice(0,6).join(', ')+(failed.length>6?' …':''), true);
  }
}

/* ---------- Ladezustand ---------- */
function saveMeta(o){ try{ localStorage.setItem('rs.meta', JSON.stringify(o)); }catch(e){} }
function loadMeta(){ try{ return JSON.parse(localStorage.getItem('rs.meta')||'null'); }catch(e){ return null; } }

// Welche Ticker fehlen noch? Basis fuer Statuszeile und "Fehlende laden".
function missingSyms(dataMap){
  const syms = [...new Set(ROWS.filter(r=>r.type==='tk').map(r=>r.ticker))];
  return syms.filter(s=> s!==activeBench && !(dataMap && dataMap[s] && (dataMap[s].rsFull||dataMap[s].rs)));
}
function fmtDay(iso){
  if(!iso) return '–';
  const p = String(iso).slice(0,10).split('-');
  return p.length===3 ? `${p[2]}.${p[1]}.${p[0].slice(2)}` : iso;
}
function renderStatus(dataMap){
  if(running) return;                       // waehrend des Ladens zeigt showStatus den Fortschritt
  const el = $('#status'); if(!el) return;
  if(!localStorage.getItem(LS.key)){ el.classList.add('hidden'); return; }
  el.classList.remove('hidden');

  const meta = loadMeta() || {};
  const syms = [...new Set(ROWS.filter(r=>r.type==='tk').map(r=>r.ticker))].filter(s=>s!==activeBench);
  const miss = missingSyms(dataMap);
  const okCount = syms.length - miss.length;

  // Datenstand: das angezeigte Fenster endet lagDays vor dem letzten geladenen Kurstag
  let stand = fmtDay(meta.dataDate);
  if(meta.dataDate && lagDays>0) stand += ` − ${lagDays} Tag`;
  const lauf = meta.lastRun
    ? new Date(meta.lastRun).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})
    : 'nie';

  let kind = 'live', txt = `Kurse ${stand} · geladen ${lauf}`, extra = `${okCount}/${syms.length}`;
  if(miss.length){
    kind = meta.stopped==='limit' ? 'err' : 'warn';
    extra = `${okCount}/${syms.length} — ${miss.length} fehlen`;
    if(meta.stopped==='limit') txt = `API-Tageslimit erreicht${meta.stoppedAt?' bei '+meta.stoppedAt:''} · Kurse ${stand}`;
  }
  $('#statusDot').className = 'dot ' + (kind==='err'?'err':(kind==='warn'?'warn':'live'));
  $('#statusText').textContent = txt;
  $('#statusMeta').innerHTML = miss.length
    ? `<span title="${esc(miss.slice(0,25).join(', '))}">${extra}</span> <button class="ministat" onclick="refresh()">Fehlende laden</button>`
    : extra;
}

// RS_STS % = Zeit-Perzentil der heutigen RS innerhalb des Fensters.
// Jeffs Excel-Formel (Screenshot vom 15.07.2024): =PERCENTRANK(AF3:BD3,BD3)
// -> also PERCENTRANK.INC der letzten RS gegen die eigene Reihe, NICHT gegen die Peer-Gruppe.
// Alternative: Perzentilrang der heutigen RS INNERHALB der Gruppe (frühere Annahme).
// Bleibt als Vergleichsmodus erhalten, ist aber nicht Jeffs Formel.
function computePeerRanks(dataMap){
  let cur=[]; const groups=[];
  ROWS.forEach(r=>{
    if(r.type==='group'){ if(cur.length) groups.push(cur); cur=[]; }
    else cur.push(r.ticker);
  });
  if(cur.length) groups.push(cur);
  groups.forEach(tickers=>{
    const vals = tickers.map(t=>{
      const d=dataMap[t];
      return (d&&d.rs&&d.rs.length)? d.rs.at(-1) : null;
    }).filter(v=>v!=null);
    tickers.forEach(t=>{
      const d=dataMap[t];
      if(!d||!d.rs||!d.rs.length) return;
      d.pct = vals.length>=2 ? percentRank(vals, d.rs.at(-1)) : (d.timePct??null);
    });
  });
}

// Stochastik-Position im Fenster: 0 % = auf dem Tief, 100 % = auf dem Hoch.
function stochPos(w){
  let mn=w[0], mx=w[0];
  for(const v of w){ if(v<mn) mn=v; if(v>mx) mx=v; }
  return mx===mn ? 0 : (w.at(-1)-mn)/(mx-mn);
}

// Schneidet aus der gespeicherten Historie das eingestellte Fenster und leitet alle
// Anzeigewerte daraus ab. Laeuft bei jedem Rendern — Fensterwechsel kostet kein Neuladen.
function applyPct(dataMap){
  if(!dataMap) return;
  Object.values(dataMap).forEach(d=>{
    if(!d) return;
    let full = d.rsFull || d.rs;             // d.rs: Altbestand aus dem frueheren Cache
    if(lagDays>0 && full && full.length>lagDays) full = full.slice(0, -lagDays);
    if(!full || full.length<3){ d.rs=null; d.pct=null; d.thrust=null; return; }
    const w = full.slice(-windowN);
    const base = w[0];
    d.rs = w.map(x=> x/base);                // auf Fensterstart normiert, fuer das Histogramm
    d.timePct = percentRank(d.rs, d.rs.at(-1));
    d.stochPct = stochPos(d.rs);
    d.thrust = weightedThrust(d.rs);
    // Tages-RS: Veraenderung der RS am letzten Tag, in Prozent. Misst Rotation —
    // steigt alles gleich stark, ist das 0, obwohl die Tagesperformance hoch war.
    d.dayRS = w.length>=2 ? (w.at(-1)/w.at(-2) - 1) * 100 : null;
    d.pct = pctMode==='stoch' ? d.stochPct : d.timePct;
  });
  if(pctMode==='peer') computePeerRanks(dataMap);
}

// „heute geladen"-Tracking pro Tag
function getLoadedToday(dayKey){
  try{ const o=JSON.parse(localStorage.getItem('rs.loaded')||'{}'); return o.day===dayKey?(o.map||{}):{}; }
  catch(e){ return {}; }
}
function saveLoadedToday(dayKey, map){
  try{ localStorage.setItem('rs.loaded', JSON.stringify({day:dayKey, map})); }catch(e){}
}

function saveCache(map){ try{ localStorage.setItem(LS.cache, JSON.stringify({t:Date.now(),map})); }catch(e){} }
function loadCache(){ try{ const c=JSON.parse(localStorage.getItem(LS.cache)); return c?c.map:null; }catch(e){ return null; } }
const sleep = ms => new Promise(r=>setTimeout(r,ms));

/* ---------- Laden ueber lange Strecken am Leben halten ---------- */
// iOS drosselt bzw. stoppt Timer, sobald die Seite in den Hintergrund geht oder der
// Bildschirm sperrt. Bei ~13 Minuten Ladezeit reisst der Lauf dadurch zuverlaessig ab.
let running = false;
let wakeLock = null;
async function acquireWakeLock(){
  running = true;
  try{ wakeLock = await navigator.wakeLock.request('screen'); }catch(e){ wakeLock = null; }
  return wakeLock;
}
function releaseWakeLock(){
  running = false;
  try{ wakeLock?.release(); }catch(e){}
  wakeLock = null;
}
// Nach der Rueckkehr in den Vordergrund automatisch weitermachen. Der Tages-Cache sorgt
// dafuer, dass nur die noch fehlenden Ticker geholt werden.
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) return;
  // Das System gibt den Wake Lock beim Wegschalten frei — beim Zurueckkommen neu holen.
  if(running){ acquireWakeLock(); return; }
  if(!localStorage.getItem(LS.key)) return;
  const syms = [...new Set(ROWS.filter(r=>r.type==='tk').map(r=>r.ticker))];
  const cache = loadCache() || {};
  const missing = syms.filter(s=> s!==activeBench && !(cache[s] && (cache[s].rsFull||cache[s].rs)));
  if(missing.length){
    toast(`Fortsetzen: ${missing.length} Ticker fehlen noch`);
    setTimeout(refresh, 400);
  }
});

// Aus Cache rendern und dabei Peer-Ranks frisch berechnen (konsistente 1M-Anzeige)
function renderCached(){
  const m = loadCache();
  if(m) applyPct(m);
  render(m);
}

/* ---------- Status / toast ---------- */
function showStatus(kind,text,meta){
  const s=$('#status'); s.classList.remove('hidden');
  $('#statusDot').className='dot '+(kind==='err'?'err':(kind==='live'?'live':''));
  $('#statusText').textContent=text; $('#statusMeta').textContent=meta||'';
}
let toastT;
function toast(msg,isErr){
  const t=$('#toast'); t.textContent=msg; t.className='toast show'+(isErr?' err':'');
  clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast'+(isErr?' err':''),3200);
}

/* ---------- Sheets ---------- */
function openSheet(which){
  const bg = which==='ticker'?$('#tickerBg'):$('#setBg');
  const sh = which==='ticker'?$('#tickerSheet'):$('#setSheet');
  if(which==='ticker'){ $('#tickerText').value = localStorage.getItem(LS.tickers)||DEFAULT_TICKERS; }
  if(which==='set'){
    $('#apiKey').value = localStorage.getItem(LS.key)||'';
    $('#benchSel').value = benchmark;
    $('#windowN').value = windowN;
    $('#pctSel').value = pctMode;
    $('#lagSel').value = String(lagDays);
    $('#chartSel').value = chartSrc;
    $('#pctWinLbl').textContent = windowN;
  }
  bg.classList.add('open'); sh.classList.add('open');
}
function closeSheets(){
  document.querySelectorAll('.sheet-bg,.sheet').forEach(el=>el.classList.remove('open'));
}

/* ---------- Wire up ---------- */
$('#btnRefresh').onclick = refresh;
$('#btnTickers').onclick = ()=>openSheet('ticker');
$('#btnSettings').onclick = ()=>openSheet('set');
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheets);
$('#tickerBg').onclick=closeSheets; $('#setBg').onclick=closeSheets;

// Reiterleiste: Übersicht + ein Reiter je Gruppe. Wird aus der Ticker-Liste aufgebaut,
// damit eigene Gruppen automatisch einen Reiter bekommen.
function buildTabs(){
  const bar = $('#viewbar');
  const labels = buildBlocks().map(b=>b.label).filter(Boolean);
  // Kurzform fuer die Reiter, damit sie auf den Bildschirm passen
  const short = l => l.replace(/^Equal-Weight /,'EW ').replace(/ Sektoren$/,'').replace(/ Groups$/,'');
  bar.innerHTML =
    `<button class="chip" data-tab="dash">Übersicht</button>` +
    `<button class="chip" data-tab="*">Alle</button>` +
    labels.map(l=>`<button class="chip" data-tab="g:${esc(l)}">${esc(short(l))}</button>`).join('');
  bar.querySelectorAll('.chip').forEach(c=>{
    c.onclick = ()=>{
      const t = c.dataset.tab;
      viewMode = t==='dash' ? 'dash' : 'list';
      groupFilter = t.startsWith('g:') ? t.slice(2) : null;
      localStorage.setItem('rs.view', viewMode);
      localStorage.setItem('rs.grp', groupFilter||'');
      markTabs();
      renderCached();
      window.scrollTo(0,0);
    };
  });
  markTabs();
}
function markTabs(){
  const active = viewMode==='dash' ? 'dash' : (groupFilter ? 'g:'+groupFilter : '*');
  document.querySelectorAll('#viewbar .chip').forEach(x=>x.classList.toggle('active', x.dataset.tab===active));
}

// Sortier-Chips
document.querySelectorAll('.chip[data-sort]').forEach(c=>{
  c.onclick = ()=>{
    sortMode = c.dataset.sort;
    localStorage.setItem('rs.sort', sortMode);
    document.querySelectorAll('.chip[data-sort]').forEach(x=>x.classList.toggle('active', x===c));
    renderCached();
  };
});

$('#saveTickers').onclick = ()=>{
  const txt = $('#tickerText').value;
  localStorage.setItem(LS.tickers, txt);
  loadTickers(); buildTabs(); closeSheets();
  renderCached();
  toast('Ticker gespeichert'); 
  setTimeout(refresh, 250);
};
$('#resetTickers').onclick = ()=>{
  $('#tickerText').value = DEFAULT_TICKERS;
  localStorage.setItem(LS.tickers, DEFAULT_TICKERS);
  loadTickers(); toast('Standardliste geladen');
};
$('#saveSettings').onclick = ()=>{
  const k=$('#apiKey').value.trim();
  localStorage.setItem(LS.key, k);

  const prevBench = benchmark, prevWin = windowN;
  benchmark = $('#benchSel').value; localStorage.setItem(LS.bench, benchmark);
  windowN = Math.max(10,Math.min(60,+$('#windowN').value||21)); localStorage.setItem(LS.win, windowN);
  pctMode = $('#pctSel').value; localStorage.setItem('rs.pctmode', pctMode);
  chartSrc = $('#chartSel').value; localStorage.setItem('rs.chartsrc', chartSrc);
  lagDays = +$('#lagSel').value; localStorage.setItem('rs.lag', lagDays);
  activeBench = benchmark;
  $('#benchLabel').textContent = benchmark;
  closeSheets();

  // Nur ein Benchmark-Wechsel macht die gespeicherten Reihen ungültig. Fenster und Maß
  // werden aus der vorhandenen Historie neu berechnet — kein Neuladen nötig.
  const benchChanged = benchmark!==prevBench;
  if(benchChanged){ localStorage.removeItem(LS.cache); localStorage.removeItem('rs.loaded'); }

  if(!k){ render(null); return; }
  if(benchChanged){ toast('Benchmark geändert – lade alles neu …'); setTimeout(()=>refresh({force:true}),250); return; }
  renderCached();
  toast(windowN!==prevWin ? `Fenster: ${windowN} Tage – neu berechnet` : 'Gespeichert');
};

$('#forceReload').onclick = ()=>{
  closeSheets();
  toast('Lade alle Ticker neu …');
  setTimeout(()=>refresh({force:true}), 250);
};

$('#testConn').onclick = async ()=>{
  const k=$('#apiKey').value.trim();
  const res=$('#testResult');
  if(!k){ res.innerHTML='<span style="color:var(--down)">Kein API-Key eingegeben.</span>'; return; }
  const chosen=$('#benchSel').value;
  const probes=[...new Set([chosen,'SPY','QQQ'])];
  res.innerHTML='Teste …';
  let out=[];
  for(const sym of probes){
    try{
      const r=await fetch(`${API}?symbol=${encodeURIComponent(sym)}&interval=1day&outputsize=2&apikey=${encodeURIComponent(k)}`);
      const j=await r.json();
      if(j.status==='error') out.push(`<div><b style="color:var(--down)">✕ ${sym}</b> — ${esc((j.message||'').slice(0,60))}</div>`);
      else if(j.values) out.push(`<div><b style="color:var(--up)">✓ ${sym}</b> — ok</div>`);
      else out.push(`<div><b style="color:var(--gold)">? ${sym}</b> — keine Daten</div>`);
    }catch(e){ out.push(`<div><b style="color:var(--down)">✕ ${sym}</b> — Netzwerkfehler</div>`); }
    res.innerHTML=out.join('');
  }
  const okChosen = out[0].includes('✓');
  out.push(`<div style="margin-top:8px;color:var(--dim)">${okChosen?'Benchmark <b>'+chosen+'</b> funktioniert.':'Benchmark <b>'+chosen+'</b> geht nicht – nimm ein Symbol mit ✓ (meist SPY).'}</div>`);
  res.innerHTML=out.join('');
};

/* ---------- Init ---------- */
loadTickers();
$('#benchLabel').textContent = benchmark;
document.querySelectorAll('.chip[data-sort]').forEach(x=>x.classList.toggle('active', x.dataset.sort===sortMode));
buildTabs();
renderCached();
if('serviceWorker' in navigator){/* offline shell optional */}
</script>
